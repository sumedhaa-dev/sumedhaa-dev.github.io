{{ define "main" }}
<article class="portfolio-shell section-page about-page story-page">
  <header class="about-hero">
    <p class="eyebrow">{{ .Params.eyebrow }}</p>
    <h1>A little about me</h1>
    <p class="about-lead">{{ .Params.lead }}</p>
  </header>

  {{ partial "golden-shower-divider.html" . }}

  <div class="about-story">{{ .Content }}</div>
  <template id="story-marker-template">
    <span class="story-chapter-marker" aria-hidden="true"><svg viewBox="-14 -14 28 28">{{ partial "golden-shower-mark.html" dict }}</svg></span>
  </template>

  <nav class="about-links" aria-label="More to explore">
    <a class="text-link" href="{{ "travel/" | relURL }}">Visit my travel journal <span aria-hidden="true">→</span></a>
    <a class="text-link" href="{{ "resume/" | relURL }}">View my résumé <span aria-hidden="true">↗</span></a>
  </nav>
</article>
<script>
  (() => {
    const story = document.querySelector('.about-story');
    const template = document.getElementById('story-marker-template');
    if (!story || !template) return;

    const chapters = [...story.querySelectorAll('h2')];
    if (!chapters.length) return;
    const marker = template.content.firstElementChild;
    chapters.forEach(heading => heading.prepend(marker.cloneNode(true)));

    let frame = 0;
    const updateStoryThread = () => {
      frame = 0;
      const firstTop = chapters[0].offsetTop;
      const readingLine = innerHeight * 0.4;
      let current = chapters[0];
      for (const heading of chapters) {
        if (heading.getBoundingClientRect().top <= readingLine) current = heading;
      }
      chapters.forEach(heading => heading.classList.toggle('is-current', heading === current));
      story.style.setProperty('--story-thread-progress', `${Math.max(0, current.offsetTop - firstTop + current.offsetHeight / 2)}px`);
    };
    const scheduleUpdate = () => {
      if (!frame) frame = requestAnimationFrame(updateStoryThread);
    };

    addEventListener('scroll', scheduleUpdate, { passive:true });
    addEventListener('resize', scheduleUpdate, { passive:true });
    scheduleUpdate();
  })();
</script>
{{ end }}
