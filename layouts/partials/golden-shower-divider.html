{{ $count := .Scratch.Get "golden-divider-count" | default 0 }}
{{ $flowerID := printf "golden-shower-flower-%d" $count }}
{{ $petalGradientID := printf "golden-shower-petal-gradient-%d" $count }}
<div class="botanical-divider botanical-divider--golden" data-botanical-divider aria-hidden="true">
  <svg viewBox="0 0 360 166" fill="none" focusable="false">
    <defs>
      <linearGradient id="{{ $petalGradientID }}" x1="0" y1="1" x2="0.2" y2="0">
        <stop class="golden-petal-shadow" offset="0" stop-color="#e6a51c"/>
        <stop class="golden-petal-mid" offset=".52" stop-color="#f6c83f"/>
        <stop class="golden-petal-light" offset="1" stop-color="#fff4bd"/>
      </linearGradient>
      <g id="{{ $flowerID }}" class="golden-flower">
        <path class="golden-petal" fill="url(#{{ $petalGradientID }})" d="M0 0 C-2.5-1.4-4.3-5.1-2-8.4 C-.8-10 1-9.2 2-7.4 C4-4.5 2.4-1.2 0 0Z"/>
        <path class="golden-petal" fill="url(#{{ $petalGradientID }})" d="M0 0 C-2.5-1.4-4.3-5.1-2-8.4 C-.8-10 1-9.2 2-7.4 C4-4.5 2.4-1.2 0 0Z" transform="rotate(72)"/>
        <path class="golden-petal" fill="url(#{{ $petalGradientID }})" d="M0 0 C-2.5-1.4-4.3-5.1-2-8.4 C-.8-10 1-9.2 2-7.4 C4-4.5 2.4-1.2 0 0Z" transform="rotate(144)"/>
        <path class="golden-petal" fill="url(#{{ $petalGradientID }})" d="M0 0 C-2.5-1.4-4.3-5.1-2-8.4 C-.8-10 1-9.2 2-7.4 C4-4.5 2.4-1.2 0 0Z" transform="rotate(216)"/>
        <path class="golden-petal" fill="url(#{{ $petalGradientID }})" d="M0 0 C-2.5-1.4-4.3-5.1-2-8.4 C-.8-10 1-9.2 2-7.4 C4-4.5 2.4-1.2 0 0Z" transform="rotate(288)"/>
        <g class="golden-petal-veins">
          <path d="M0-1 Q-.3-4 .1-7.3"/><path d="M0-1 Q-.3-4 .1-7.3" transform="rotate(72)"/>
          <path d="M0-1 Q-.3-4 .1-7.3" transform="rotate(144)"/><path d="M0-1 Q-.3-4 .1-7.3" transform="rotate(216)"/>
          <path d="M0-1 Q-.3-4 .1-7.3" transform="rotate(288)"/>
        </g>
        <path class="golden-flower-stamens" d="M0 0 Q3-1 4-4 M0 0 Q-3-1-4-4 M0 0 Q1 2 1 4 M0 0 Q-1 2-1 4"/>
        <circle class="golden-flower-center" r="1.35" fill="#aa7413"/>
      </g>
      <g id="golden-pendant-{{ $count }}" class="golden-pendant">
        <path class="golden-raceme" d="M0 0 Q2 20 0 47 M0 12 Q-6 19-9 27 M1 19 Q7 26 9 33"/>
        <use href="#{{ $flowerID }}" transform="translate(0 5) scale(.62)"/>
        <use href="#{{ $flowerID }}" transform="translate(-4 12) scale(.62)"/><use href="#{{ $flowerID }}" transform="translate(4 13) scale(.62)"/>
        <use href="#{{ $flowerID }}" transform="translate(-7 20) scale(.62)"/><use href="#{{ $flowerID }}" transform="translate(0 20) scale(.62)"/><use href="#{{ $flowerID }}" transform="translate(7 21) scale(.62)"/>
        <use href="#{{ $flowerID }}" transform="translate(-9 28) scale(.62)"/><use href="#{{ $flowerID }}" transform="translate(-3 28) scale(.62)"/><use href="#{{ $flowerID }}" transform="translate(4 29) scale(.62)"/><use href="#{{ $flowerID }}" transform="translate(9 29) scale(.62)"/>
        <use href="#{{ $flowerID }}" transform="translate(-7 36) scale(.62)"/><use href="#{{ $flowerID }}" transform="translate(0 37) scale(.62)"/><use href="#{{ $flowerID }}" transform="translate(7 36) scale(.62)"/>
        <use href="#{{ $flowerID }}" transform="translate(-4 43) scale(.62)"/><use href="#{{ $flowerID }}" transform="translate(3 44) scale(.62)"/>
      </g>
    </defs>

    <!-- A gently bowed, balanced branch with paired leaf sprays. -->
    <path class="divider-branch" d="M12 23 C88 72 272 72 348 23"/>
    <path class="golden-leaf-spine" d="M52 44 Q42 29 31 19 M91 59 Q79 41 73 27 M133 68 Q124 49 122 35 M180 71 Q180 49 180 31 M227 68 Q236 49 238 35 M269 59 Q281 41 287 27 M308 44 Q318 29 329 19"/>
    <g class="golden-leaflets">
      <path d="M40 34 Q29 25 26 18 Q38 19 43 30Z"/><path d="M38 31 Q28 32 20 29 Q27 23 37 27Z"/>
      <path d="M80 49 Q70 38 69 31 Q80 35 84 45Z"/><path d="M79 45 Q68 45 61 40 Q70 36 80 41Z"/>
      <path d="M122 59 Q114 48 115 41 Q124 45 127 55Z"/><path d="M122 55 Q112 57 105 52 Q113 47 123 51Z"/>
      <path d="M169 62 Q163 50 165 43 Q174 48 175 58Z"/><path d="M191 62 Q197 50 195 43 Q186 48 185 58Z"/>
      <path d="M238 59 Q246 48 245 41 Q236 45 233 55Z"/><path d="M238 55 Q248 57 255 52 Q247 47 237 51Z"/>
      <path d="M280 49 Q290 38 291 31 Q280 35 276 45Z"/><path d="M281 45 Q292 45 299 40 Q290 36 280 41Z"/>
      <path d="M320 34 Q331 25 334 18 Q322 19 317 30Z"/><path d="M322 31 Q332 32 340 29 Q333 23 323 27Z"/>
    </g>

    <!-- Dense hanging flower bunches attach directly to the branch. -->
    <use href="#golden-pendant-{{ $count }}" transform="translate(68 47) scale(.67)"/>
    <use href="#golden-pendant-{{ $count }}" transform="translate(106 59) scale(.78)"/>
    <use href="#golden-pendant-{{ $count }}" transform="translate(146 68) scale(.9)"/>
    <use href="#golden-pendant-{{ $count }}" transform="translate(180 71) scale(1)"/>
    <use href="#golden-pendant-{{ $count }}" transform="translate(214 68) scale(.9)"/>
    <use href="#golden-pendant-{{ $count }}" transform="translate(254 59) scale(.78)"/>
    <use href="#golden-pendant-{{ $count }}" transform="translate(292 47) scale(.67)"/>
  </svg>
</div>
{{ .Scratch.Set "golden-divider-count" (add $count 1) }}
