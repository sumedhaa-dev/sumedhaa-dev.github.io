<div class="section-bloom section-bloom-{{ . }}" aria-hidden="true">
  <svg viewBox="0 0 240 240" fill="none">
    <path class="branch-line" d="M228 12 Q150 38 128 100 Q112 148 60 168 Q28 180 16 220 M128 100 Q150 118 178 128 M60 168 Q40 158 18 160 M151 65 Q166 42 190 39" />
    <g class="branch-leaf" transform="translate(190 39) rotate(205)"><path d="M0 0 Q9 -6 18 0 Q9 6 0 0Z" /></g>
    <g class="branch-leaf" transform="translate(164 52) rotate(28)"><path d="M0 0 Q9 -6 18 0 Q9 6 0 0Z" /></g>
    <g class="branch-leaf" transform="translate(137 83) rotate(205)"><path d="M0 0 Q8 -5 16 0 Q8 5 0 0Z" /></g>
    <g class="branch-leaf" transform="translate(112 120) rotate(28)"><path d="M0 0 Q9 -6 18 0 Q9 6 0 0Z" /></g>
    <g class="branch-leaf" transform="translate(75 162) rotate(210)"><path d="M0 0 Q8 -5 16 0 Q8 5 0 0Z" /></g>
    <g class="branch-leaf" transform="translate(40 179) rotate(26)"><path d="M0 0 Q8 -5 16 0 Q8 5 0 0Z" /></g>
    {{ range (slice "178 128" "36 162" "190 39") }}
    {{ $position := split . " " }}
    <g class="branch-blossom" transform="translate({{ index $position 0 }} {{ index $position 1 }})">
      <ellipse class="branch-blossom-petal" cx="0" cy="-4" rx="2.5" ry="4" />
      <ellipse class="branch-blossom-petal" cx="3.8" cy="-1.2" rx="2.5" ry="4" transform="rotate(72 3.8 -1.2)" />
      <ellipse class="branch-blossom-petal" cx="2.4" cy="3.2" rx="2.5" ry="4" transform="rotate(144 2.4 3.2)" />
      <ellipse class="branch-blossom-petal" cx="-2.4" cy="3.2" rx="2.5" ry="4" transform="rotate(216 -2.4 3.2)" />
      <ellipse class="branch-blossom-petal" cx="-3.8" cy="-1.2" rx="2.5" ry="4" transform="rotate(288 -3.8 -1.2)" />
      <circle class="branch-blossom-center" r="1.4" />
    </g>
    {{ end }}
  </svg>
</div>
