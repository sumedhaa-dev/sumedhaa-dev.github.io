  <nav class="portfolio-nav" aria-label="Main navigation">
    <a class="wordmark" href="{{ "/" | relURL }}" aria-label="Home">S</a>
    <div class="nav-links">
      <a href="{{ "/#story" | relURL }}">Story</a>
      <a href="{{ "/#chapters" | relURL }}">Chapters</a>
      <a href="{{ "/blog/" | relURL }}">Writing</a>
      <a href="{{ "/travel/" | relURL }}">Travel</a>

<script>
  (() => {
    const saved = localStorage.getItem('pref-theme');
    if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) document.body.classList.add('dark');
  })();
</script>
