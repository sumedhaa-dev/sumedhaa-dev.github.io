<footer class="portfolio-footer">
  <span>© {{ now.Format "2006" }} {{ .Site.Data.profile.name }}</span>
  <blockquote class="footer-quote">
    <p>“{{ .Site.Data.footer.stoic_quote.text }}”</p>
    <cite><a href="{{ .Site.Data.footer.stoic_quote.source }}" target="_blank" rel="noopener noreferrer">{{ .Site.Data.footer.stoic_quote.attribution }}</a></cite>
  </blockquote>
  <a href="#top">Back to top ↑</a>
</footer>
<script>
  const themeButton = document.getElementById('theme-toggle');
  themeButton?.addEventListener('click', () => {
    const isDark = document.body.classList.toggle('dark');
    localStorage.setItem('pref-theme', isDark ? 'dark' : 'light');
  });

  (() => {
    const dividers = [...document.querySelectorAll('[data-botanical-divider]')];
    if (!dividers.length || matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    let pointerX = innerWidth / 2;
    let pointerY = innerHeight / 2;
    let frame = 0;
    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
    const update = () => {
      frame = 0;
      for (const divider of dividers) {
        const rect = divider.getBoundingClientRect();
        const dx = (pointerX - (rect.left + rect.width / 2)) / innerWidth;
        const dy = (pointerY - (rect.top + rect.height / 2)) / innerHeight;
        const scrollDrift = clamp((rect.top + rect.height / 2 - innerHeight / 2) * -0.035, -12, 12);
        divider.style.setProperty('--drift-x', `${clamp(dx * 30, -16, 16)}px`);
        divider.style.setProperty('--drift-y', `${clamp(dy * 18 + scrollDrift, -16, 16)}px`);
        divider.style.setProperty('--drift-tilt', `${clamp(dx * 10, -5, 5)}deg`);
      }
    };
    const requestUpdate = () => {
      if (!frame) frame = requestAnimationFrame(update);
    };

    addEventListener('pointermove', event => {
      pointerX = event.clientX;
      pointerY = event.clientY;
      requestUpdate();
    }, { passive: true });
    addEventListener('scroll', requestUpdate, { passive: true });
    addEventListener('resize', requestUpdate, { passive: true });
    requestUpdate();
  })();
</script>
<script>
  (() => {
    const timeline = document.querySelector('[data-resume-timeline]');
    const bloom = timeline?.querySelector('.resume-traveling-bloom');
    if (!timeline || !bloom || matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    let frame = 0;
    const updateBloom = () => {
      frame = 0;
      const bounds = timeline.getBoundingClientRect();
      const focusLine = innerHeight * 0.46;
      const travel = Math.max(0, bounds.height - bloom.offsetHeight);
      const progress = Math.min(1, Math.max(0, (focusLine - bounds.top) / bounds.height));
      bloom.style.transform = `translateY(${travel * progress}px)`;
    };
    const scheduleUpdate = () => {
      if (!frame) frame = requestAnimationFrame(updateBloom);
    };

    addEventListener('scroll', scheduleUpdate, { passive: true });
    addEventListener('resize', scheduleUpdate, { passive: true });
    scheduleUpdate();
  })();
</script>
