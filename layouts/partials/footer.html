<footer class="portfolio-footer">
  <span>© {{ now.Format "2006" }} {{ .Site.Data.profile.name }}</span>
  <blockquote class="footer-quote">
    <p>“{{ .Site.Data.footer.stoic_quote.text }}”</p>
    <cite><a href="{{ .Site.Data.footer.stoic_quote.source }}" target="_blank" rel="noopener noreferrer">{{ .Site.Data.footer.stoic_quote.attribution }}</a></cite>
  </blockquote>
  <a href="#top">Back to top ↑</a>
</footer>
<script>
  const themeButton = document.getElementById('theme-toggle');
  themeButton?.addEventListener('click', () => {
    const isDark = document.body.classList.toggle('dark');
    localStorage.setItem('pref-theme', isDark ? 'dark' : 'light');
  });

  (() => {
    const dividers = [...document.querySelectorAll('[data-botanical-divider]')];
    if (!dividers.length || matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    let pointerX = innerWidth / 2;
    let pointerY = innerHeight / 2;
    let frame = 0;
    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
    const update = () => {
      frame = 0;
      for (const divider of dividers) {
        const rect = divider.getBoundingClientRect();
        const dx = (pointerX - (rect.left + rect.width / 2)) / innerWidth;
        const dy = (pointerY - (rect.top + rect.height / 2)) / innerHeight;
        const scrollDrift = clamp((rect.top + rect.height / 2 - innerHeight / 2) * -0.035, -12, 12);
        divider.style.setProperty('--drift-x', `${clamp(dx * 30, -16, 16)}px`);
        divider.style.setProperty('--drift-y', `${clamp(dy * 18 + scrollDrift, -16, 16)}px`);
        divider.style.setProperty('--drift-tilt', `${clamp(dx * 10, -5, 5)}deg`);
      }
    };
    const requestUpdate = () => {
      if (!frame) frame = requestAnimationFrame(update);
    };

    addEventListener('pointermove', event => {
      pointerX = event.clientX;
      pointerY = event.clientY;
      requestUpdate();
    }, { passive: true });
    addEventListener('scroll', requestUpdate, { passive: true });
    addEventListener('resize', requestUpdate, { passive: true });
    requestUpdate();
  })();
</script>
<script>
  (() => {
    const timeline = document.querySelector('[data-resume-timeline]');
    const bloom = timeline?.querySelector('.resume-traveling-bloom');
    if (!timeline || !bloom || matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    const entries = [...timeline.querySelectorAll('.resume-timeline-item')];
    const canopyOrigin = document.querySelector('.resume-canopy-origin');
    let pointerX = innerWidth / 2;
    let frame = 0;
    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
    const updateBloom = () => {
      frame = 0;
      if (!entries.length) return;
      const focusLine = innerHeight * 0.46;
      const scrollY = window.scrollY;
      const timelineBounds = timeline.getBoundingClientRect();
      const originBounds = canopyOrigin?.getBoundingClientRect();
      const firstMarker = entries[0].querySelector('.resume-timeline-marker').getBoundingClientRect();
      const originY = originBounds ? originBounds.top + originBounds.height / 2 + scrollY : 0;
      const landingY = firstMarker.top + firstMarker.height / 2 + scrollY;
      const fallDistance = Math.max(1, landingY - originY);
      const fallProgress = originBounds ? clamp(scrollY / fallDistance, 0, 1) : 1;
      const atCanopy = Boolean(originBounds && scrollY <= 1);
      const isFalling = Boolean(originBounds && scrollY > 1 && fallProgress < 1);
      const timelineActive = !atCanopy && !isFalling;
      let activeEntry = entries[0];
      const markerCenter = entry => {
        const markerBounds = entry.querySelector('.resume-timeline-marker').getBoundingClientRect();
        return markerBounds.top + markerBounds.height / 2;
      };
      let activeCenter = markerCenter(activeEntry);
      let closestDistance = Math.abs(activeCenter - focusLine);

      for (const entry of (timelineActive ? entries.slice(1) : [])) {
        const center = markerCenter(entry);
        const distance = Math.abs(center - focusLine);
        if (distance < closestDistance) {
          activeEntry = entry;
          activeCenter = center;
          closestDistance = distance;
        }
      }

      entries.forEach(entry => entry.classList.toggle('is-current', timelineActive && entry === activeEntry));
      bloom.classList.toggle('is-falling', isFalling);
      let swayX = 0;
      let swayRotation = 0;

      if (atCanopy) {
        bloom.style.left = `${originBounds.left + originBounds.width / 2 - timelineBounds.left - bloom.offsetWidth / 2}px`;
        bloom.style.transform = `translateY(${originBounds.top + originBounds.height / 2 - timelineBounds.top - bloom.offsetHeight / 2}px)`;
      } else if (isFalling) {
        const progress = fallProgress;
        const originX = originBounds.left + originBounds.width / 2 + window.scrollX;
        const landingX = firstMarker.left + firstMarker.width / 2 + window.scrollX;
        const envelope = Math.sin(progress * Math.PI);
        const wind = Math.sin(progress * Math.PI * 3.5) * 20 * envelope;
        const cursor = clamp((pointerX - (originX + (landingX - originX) * progress - window.scrollX)) * .025, -9, 9) * envelope;
        swayX = wind + cursor;
        swayRotation = Math.sin(progress * Math.PI * 3.5 - .45) * 17 * envelope;
        const desiredX = originX + (landingX - originX) * progress - window.scrollX;
        const desiredY = originY + (landingY - originY) * progress - scrollY;
        bloom.style.left = `${desiredX - timelineBounds.left - bloom.offsetWidth / 2}px`;
        bloom.style.transform = `translateY(${desiredY - timelineBounds.top - bloom.offsetHeight / 2}px)`;
      } else {
        const marker = activeEntry.querySelector('.resume-timeline-marker').getBoundingClientRect();
        const cursorOffset = clamp((pointerX - (marker.left + marker.width / 2)) * .035, -12, 12);
        swayRotation = clamp((pointerX - (marker.left + marker.width / 2)) * .035, -8, 8);
        bloom.style.left = `${marker.left + marker.width / 2 - timelineBounds.left - bloom.offsetWidth / 2 + cursorOffset}px`;
        bloom.style.transform = `translateY(${activeCenter - timelineBounds.top - bloom.offsetHeight / 2}px)`;
      }
      bloom.style.setProperty('--bloom-sway-x', `${swayX}px`);
      bloom.style.setProperty('--bloom-sway-rotation', `${swayRotation}deg`);
    };
    const scheduleUpdate = () => {
      if (!frame) frame = requestAnimationFrame(updateBloom);
    };

    addEventListener('scroll', scheduleUpdate, { passive: true });
    addEventListener('resize', scheduleUpdate, { passive: true });
    addEventListener('pointermove', event => {
      pointerX = event.clientX;
      scheduleUpdate();
    }, { passive: true });
    scheduleUpdate();
  })();
</script>
