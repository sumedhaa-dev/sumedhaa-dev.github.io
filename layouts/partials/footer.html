<script>
  const themeButton = document.getElementById('theme-toggle');
  themeButton?.addEventListener('click', () => {
    const isDark = document.body.classList.toggle('dark');
    localStorage.setItem('pref-theme', isDark ? 'dark' : 'light');
  });
</script>
