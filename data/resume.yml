experience:
  - company: FactSet
    role: Senior Software Engineer
    dates: Jan 2026 – Present
    location: Hyderabad, India
    highlights:
      - Architected an MCP server that exposed FactSet's data catalog and query execution capabilities as LLM-callable tools, enabling AI-assisted data discovery and analysis.
      - Designed and implemented agentic workflows for Data Navigator, orchestrating data discovery, query execution, and insight generation across data services.
      - Developed Elasticsearch-based search capabilities for Data Navigator to improve retrieval of relevant data assets and search results.
  - company: FactSet
    role: Software Engineer III
    dates: Apr 2023 – Jan 2026
    location: Hyderabad, India
    highlights:
      - Designed and implemented a data pipeline to bulk transfer 500K+ files, unifying archive and retrieval mechanisms and reducing storage costs by 20%.
      - Played a key role in FactSet's flagship product, SDF (Standard Data Feeds), by managing the curation of data from diverse sources within the FactSet ecosystem. Executed complex data transformations, ensuring a seamless client experience for a substantial customer base exceeding 4,000 across data feeds.
      - In a high-performance agile team, developed 30+ data feeds for the Banking, Insurance, Oil and Gas (Deep Sector) using Airflow, performing intricate data transformations within a set deadline.
      - Led the successful Proof-of-Concept and rollout of Crossplane, packaging, versioning, and validating compositions in CI, and publishing to AWS ECR; enabled reusable infrastructure patterns that supported the SQS Service Catalog module, reducing manual configuration effort by over 30%.
      - Planned and executed EKS Service Catalog backend upgrades from Kubernetes 1.29 to 1.32 across environments, validating add-on compatibility, migrating worker nodes to Amazon Linux 2023, and strengthening security posture with zero downtime.
      - Improved cluster efficiency for the Service Catalog backend by implementing native kubelet garbage collection through custom launch templates and user data, and retiring the Cache DaemonSet, leading to reduced disk pressure and alert noise.
      - Developed data pipelines to integrate Concordance API with Scripts Asia dataset, consisting of text data from Asian languages.
  - company: FactSet
    role: Software Engineer II
    dates: Apr 2022 – Apr 2023
    location: Hyderabad, India
    highlights:
      - Developed a scalable and serverless PySpark Rules Engine in AWS, equipped with configurable rules, that enables the internal teams and clients to process any CSV/PSV data through low code ETL processes, thereby reducing time to market, increasing revenue and sales, while allowing for automated deployments.
      - Migrated Standard Data Feeds, a legacy system to the Snowflake Data Cloud.
      - Designed and developed customised ETL pipelines with event-driven serverless infrastructure for 3 data providers orchestrated using Airflow.
      - Implemented automation of data delivery pipelines and redesigned the architecture for 7 data pipelines into 2 distinct projects (ingestion and delivery) in Airflow, resulting in an 80% decrease in costs and a 20% increase in efficiency, as measured by reduced resource utilization.
      - Streamlined and automated blue-green deployment for 4 projects utilizing Terraform, an Infrastructure as Code tool.
      - Mentored and guided junior engineers to develop customized data pipelines.
  - company: FactSet
    role: Software Engineer I
    dates: Dec 2020 – Apr 2022
    location: Hyderabad, India
    highlights:
      - Designed and implemented an elastic search cache, providing a blue-green database refresh using Airflow.
      - Developed and implemented 13 endpoints within a centralized serverless API in AWS to accommodate three distinct feeds/providers, facilitating the delivery of a variety of document types.
      - Collaborated with cross-functional teams to design, develop, and maintain high-quality, performant, and resilient pipelines, while adhering to agile methodologies.
      - Addressed queries and provided support for high-priority bugs in the integration, concordance, and feed distribution technologies developed by the team.

  - company: Dexlock
